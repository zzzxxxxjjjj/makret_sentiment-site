name: Refresh AKShare public market data
on:
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: akshare-public
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cloud.txt
      - run: python akshare_public_refresh.py
      - name: Publish public observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -c "import os, pathlib, publish_daily_snapshot as p; p.FILES = ('akshare-public-inputs.json',); print(p.GitHub(os.environ['GITHUB_TOKEN']).publish(pathlib.Path.cwd(), 'AKShare public market refresh'))"
