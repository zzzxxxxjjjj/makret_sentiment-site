name: Morning style crowding update

on:
  schedule:
    # Beijing Monday-Saturday, before the morning session.
    - cron: '17,47 22,23 * * 0-5'
    - cron: '17,47 0 * * 1-6'
    - cron: '7,17 1 * * 1-6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/style-crowding-update.yml
      - aido_style_crowding_refresh.py
      - aido_crowding_cloud_sync.py
      - tests/test_style_crowding.py
      - tests/style-crowding.test.cjs

permissions:
  contents: write

concurrency:
  group: style-crowding-update
  cancel-in-progress: false

jobs:
  update-style-crowding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test crowding validation and risk-only behavior
        run: |
          python -m unittest discover -s tests -p 'test_style_crowding.py'
          node tests/style-crowding.test.cjs
      - name: Fetch style crowding with retries
        env:
          AIDO_API_KEY: ${{ secrets.AIDO_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            if python aido_style_crowding_refresh.py; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: Publish only crowding and verify website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python aido_crowding_cloud_sync.py
