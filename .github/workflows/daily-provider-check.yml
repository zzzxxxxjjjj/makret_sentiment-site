name: Verify daily pipeline without RQData
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-provider-check.yml'
      - '.github/workflows/daily-data-update.yml'
      - 'daily_batch.py'
      - 'etf_market_refresh.py'
      - 'baostock_etf_fallback.py'
      - 'etf-trading-exceptions.json'
      - 'tests/test_akshare_baostock_fallback.py'
      - 'akshare_request_policy.py'
      - 'tests/test_akshare_rate_policy.py'
      - 'akshare_options_refresh.py'
      - 'market_data_sync.py'
      - 'broad_sentiment.py'
      - 'tests/test_akshare_options.py'
      - 'cloud_display.py'
      - 'publication_filters.py'
      - 'build_static_site.py'
      - 'sw_flow_refresh.py'
      - 'completed_session.py'
      - 'sw_history_sync.py'
      - 'sw_flow_api.py'
      - 'tests/test_sw_history_sync.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-daily.txt pyyaml
      - name: Validate independent task selection and historical model reads
        run: |
          python - <<'PY'
          import ast, hashlib, importlib.util, json, pathlib, yaml
          assert importlib.util.find_spec('rqdatac') is None
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.suffix.lower() in ('.json','.csv','.xlsx','.xlsm') and '.git' not in p.parts}
          for name in ('daily_batch.py','broad_sentiment.py','completed_session.py','akshare_options_refresh.py','market_data_sync.py','cloud_display.py','sw_flow_refresh.py','akshare_index_turnover_refresh.py','akshare_medium_bond_refresh.py','akshare_stock_fallback.py','public_stock_snapshot_refresh.py'): ast.parse(pathlib.Path(name).read_text(encoding='utf-8-sig'))
          for p in pathlib.Path('.github/workflows').glob('*.yml'): yaml.safe_load(p.read_text())
          import daily_batch as d
          from unittest.mock import patch
          from datetime import datetime
          from zoneinfo import ZoneInfo
          commands=[]
          def stage(name,command,target,outputs=()):
              commands.append(command)
              return True
          with patch.object(d,'datetime') as clock, patch.object(d,'trading_day',return_value=True), patch.object(d,'run_stage',side_effect=stage), patch.object(d,'write'), patch('data_freshness.write_report'), patch.dict('os.environ',{'RQDATAC_CONF':'must-not-be-used','AIDO_API_KEY':'','DAILY_TARGET_DATE':'2026-11-23'}):
              clock.now.return_value=datetime(2026,11,23,19,tzinfo=ZoneInfo('Asia/Shanghai'))
              d.main()
          assert ['akshare_public_refresh.py','--sources-only'] in commands
          assert ['akshare_medium_bond_refresh.py'] in commands
          assert ['akshare_index_turnover_refresh.py'] in commands
          if ['akshare_medium_bond_refresh.py'] in commands:
              assert not any(c[0] in {'ifind_medium_bond_refresh.py','ifind_index_turnover_refresh.py'} for c in commands)
          assert not any(c[0] in ('cloud_daily_update.py','sw_valuation_rotation.py','position_refresh.py') for c in commands)
          import broad_sentiment as b
          model=b.broad_market_medium_term_sentiment_snapshot()
          expected='807330.SW' if pathlib.Path('akshare-medium-bond.json').exists() else '701014.TI'
          assert any(expected in s.get('name','') for s in model['series'])
          for name,digest in before.items(): assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          print('Independent tasks and preserved historical data verified without RQData SDK')
          PY
      - run: python -m unittest discover -s tests -p 'test_akshare_*.py'
      - run: python -m unittest discover -s tests -p 'test_completed_session.py'
      - run: python -m unittest discover -s tests -p 'test_sw_*.py'
      - run: python build_static_site.py
      - name: Verify position-only PCR publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name,key in [('broad-sentiment.json','series'),('data-freshness.json','entries')]:
              data=json.loads((Path('dist')/name).read_text())
              ids=[s['id'] for s in data[key]]
              assert not any(s.startswith(('pcr-amount-','pcr-volume-')) for s in ids)
              assert sum(s.startswith('pcr-oi-') for s in ids)==8
          assert 'derivativesTrade' not in Path('dist/app.js').read_text()
          assert 'derivativesTrade' not in Path('dist/index.html').read_text()
          print('Position PCR preserved; trade PCR retired from cloud publication')
          PY
