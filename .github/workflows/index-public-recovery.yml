name: Validate and recover index financing
# Recover confirmed suspension zeros and dated BaoStock turnover.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/index-public-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-daily.txt
      - run: python -m py_compile index_public_recovery.py
      - name: Recover November 23 missing constituent
        run: DAILY_TARGET_DATE=2026-11-23 python index_public_recovery.py
      - name: Recover latest completed session independently
        run: python index_public_recovery.py
      - name: Rebuild recovered index data into published page
        run: |
          python rebuild_saved_page.py
          python build_static_site.py
      - name: Publish validated outputs and audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in broad-sentiment-page-cache.json data-freshness.json index-recovery-status.json public-index-inputs.json financing-detail-cache.json recovery-members-*.json recovery-sse-pagination.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish index financing coverage verification and BaoStock breadth audit'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
