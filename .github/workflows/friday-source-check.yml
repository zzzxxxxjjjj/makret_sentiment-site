name: Publish approved 2026-11-20 observations
# Recheck confirmed yield rename and verified iFind turnover fallback.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DAILY_TARGET_DATE: '2026-11-20'
      IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-daily.txt
      - name: Collect approved observations and record actual completeness
        run: |
          python - <<'PY'
          import json,subprocess,sys,pathlib
          target='2026-11-20'
          report={'targetDate':target,'stages':[]}
          stages=[
            ('medium',[sys.executable,'akshare_medium_inputs.py','--as-of',target],'akshare-medium-inputs.json'),
            ('turnover',[sys.executable,'ifind_index_turnover_refresh.py'],'ifind-index-turnover.json'),
            ('margin',[sys.executable,'akshare_margin_risk.py','--as-of',target],'akshare-margin-risk.json'),
            ('bond',[sys.executable,'ifind_medium_bond_refresh.py'],'ifind-medium-bond.json'),
            ('public',[sys.executable,'-c',"import json,akshare as ak; from akshare_public_refresh import collect; r=collect(ak,'2026-11-20'); print(json.dumps(r['errors'],ensure_ascii=False)); raise SystemExit(bool(r['errors']))"],'akshare-public-inputs.json')
          ]
          for name,command,filename in stages:
              try:
                  done=subprocess.run(command,timeout=360)
                  data=json.loads(pathlib.Path(filename).read_text(encoding='utf-8-sig'))
                  dates={s['id']:max((p['date'] for p in s.get('points',[])),default=None) for s in data.get('series',[])}
                  if not dates: dates={'snapshot':data.get('asOf')}
                  current=bool(dates) and all(d is not None and d>=target for d in dates.values())
                  item={'name':name,'exit':done.returncode,'current':current,'dates':dates,'errors':data.get('errors',[])}
              except Exception as exc:
                  item={'name':name,'current':False,'error':type(exc).__name__}
              report['stages'].append(item)
              print(json.dumps(item,ensure_ascii=False),flush=True)
          print('FRIDAY_REPORT='+json.dumps(report,ensure_ascii=False))
          pathlib.Path('friday-recovery-status.json').write_text(json.dumps(report,ensure_ascii=False),encoding='utf-8')
          required={s['name']:s for s in report['stages']}
          assert required['medium']['current'] and required['turnover']['current']
          public=required['public']
          assert all(d>=target for sid,d in public['dates'].items() if sid not in ('financing-balance','alla-financing-buy'))
          assert all(e['source']=='financing' for e in public.get('errors',[]))
          PY
      - name: Publish only approved observations and completeness report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- akshare-medium-inputs.json ifind-index-turnover.json akshare-public-inputs.json friday-recovery-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish approved Friday observations with financing gap disclosed'
          git pull --rebase origin main
          git push origin HEAD:main
