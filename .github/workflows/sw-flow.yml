name: Collect SW first-level industry flow
on:
  push:
    branches: [main]
    paths: [sw_flow_refresh.py, .github/workflows/sw-flow.yml]
  schedule:
    - cron: '10,40 1,2,5,6 * * 1-5'
    - cron: '20 7,10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sw-flow-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install akshare
      - run: python sw_flow_refresh.py
      - name: Publish only SW industry flow and public membership cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sw-industry-flow.json sw-flow-members.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update SW first-level industry flow snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
