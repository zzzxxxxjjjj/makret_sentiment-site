name: Collect SW first-level industry flow
on:
  push:
    branches: [main]
    paths: [sw_flow_refresh.py, .github/workflows/sw-flow.yml]
  schedule:
    - cron: '40 7 * * 1-5'
    - cron: '20 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sw-flow-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install akshare
      - run: |
          if [ "${{ github.event_name }}" = "schedule" ] && python -c 'import json; from datetime import datetime; from zoneinfo import ZoneInfo; from pathlib import Path; p=Path("sw-industry-flow.json"); now=datetime.now(ZoneInfo("Asia/Shanghai")); rows=json.loads(p.read_text(encoding="utf-8")).get("snapshots",[]) if p.exists() else []; raise SystemExit(not any(r["date"]==now.date().isoformat() and "15:30"<=r["time"]<="23:59" for r in rows))'; then
            echo "Closing snapshot already available"
          else
            python sw_flow_refresh.py
          fi
      - name: Publish only SW industry flow and public membership cache
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in sw-industry-flow.json sw-flow-members.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update SW first-level industry flow snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
