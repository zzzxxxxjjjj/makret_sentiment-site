name: Audit AKShare ordinary ROE financial fields
on:
  push:
    branches: [main]
    paths: [sw_financial_audit.py, .github/workflows/sw-financial-audit.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install akshare
      - run: python sw_financial_audit.py
      - name: Save financial schema audit only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sw-financial-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record AKShare financial field audit without changing ROE definitions'
          git pull --rebase origin main
          git push origin HEAD:main
