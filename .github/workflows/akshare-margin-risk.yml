name: Update public margin-risk history

on:
  push:
    branches: [main]
    paths:
      - akshare_margin_risk.py
      - tests/test_akshare_margin_risk.py
      - .github/workflows/akshare-margin-risk.yml
  schedule:
    # Beijing 18:35, 21:35, 06:35, 08:35, 09:05 and 09:20.
    - cron: '35 10,13,22,0 * * *'
    - cron: '5,20 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: akshare-margin-risk
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AKShare
        run: python -m pip install akshare==1.19.1 -i https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Test margin account mapping
        run: python -m unittest discover -s tests -p test_akshare_margin_risk.py
      - name: Collect published account history
        run: python akshare_margin_risk.py
      - name: Publish margin risk snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- akshare-margin-risk.json
          if git diff --cached --quiet; then
            echo 'Margin risk data unchanged.'
            exit 0
          fi
          git commit -m 'Update published margin risk data'
          git pull --rebase origin main
          git push origin HEAD:main
