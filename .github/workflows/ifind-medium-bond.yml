name: Update iFind medium bond proxy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ifind-medium-bond.yml'
permissions:
  contents: write
concurrency:
  group: ifind-medium-bond
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile ifind_medium_bond_refresh.py
      - name: Fetch verified proxy history
        env:
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        run: python ifind_medium_bond_refresh.py
      - name: Publish isolated history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ifind-medium-bond.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update iFind 701014.TI history'
          git pull --rebase origin main
          git push origin HEAD:main
