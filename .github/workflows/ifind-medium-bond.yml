name: Update public mixed-bond proxy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - run: python akshare_medium_bond_refresh.py
      - run: |
          python rebuild_saved_page.py
          python build_static_site.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- akshare-medium-bond.json broad-sentiment-page-cache.json data-freshness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public SW mixed-bond proxy and recomputed relative history'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
