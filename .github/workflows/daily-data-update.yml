name: Daily post-close market update
on:
  schedule:
    # Beijing 18:45 primary run and 20:45 recovery run, weekdays. The script checks the exchange calendar.
    - cron: '45 10,12 * * 1-5'
  push:
    paths:
      - '.github/workflows/daily-data-update.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-market-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      ENABLE_RQDATA_REFRESH: '0'
      IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
      AIDO_API_KEY: ${{ secrets.AIDO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip already successful date
        id: plan
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Asia/Shanghai'))
          p = Path('daily-update-status.json')
          state = json.loads(p.read_text()) if p.exists() else {}
          from completed_session import completed_target
          calendar=json.loads(Path('data-freshness.json').read_text()).get('tradingCalendar',[])
          target=completed_target(now,calendar)
          skip=state.get('targetDate')==target and state.get('ok') is True
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('DAILY_TARGET_DATE='+target+'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('run=' + str(not skip).lower() + '\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-daily.txt
      - uses: actions/cache/restore@v4
        if: steps.plan.outputs.run == 'true'
        with:
          path: |
            .daily-cache
            .rqdata-cache
          key: daily-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: daily-v3-
      - name: Install dependencies once
        if: steps.plan.outputs.run == 'true'
        run: python -m pip install -r requirements-daily.txt
      - name: Validate restored collectors and calendar
        if: steps.plan.outputs.run == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_akshare_*.py'
          python -m unittest discover -s tests -p 'test_completed_session.py'
      - name: Update each stage with at most one retry
        id: update
        if: steps.plan.outputs.run == 'true'
        continue-on-error: true
        run: python daily_batch.py
      - uses: actions/cache/save@v4
        if: always() && steps.plan.outputs.run == 'true'
        with:
          path: |
            .daily-cache
            .rqdata-cache
          key: daily-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish collected data and retain actual source dates
        if: always() && steps.plan.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in akshare-options-pcr.json etf-market.json etf-shares-history.json etf-net-subscription.json etf-weekly-relative-flow.json sw-industry-flow.json rqdata-fund-exposure.json style-crowding.json akshare-public-inputs.json akshare-medium-inputs.json ifind-index-turnover.json ifind-medium-bond.json akshare-margin-risk.json akshare-sw-industry-rotation.json broad-sentiment-page-cache.json data-freshness.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if [ -f daily-update-status.json ]; then git add -- daily-update-status.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update daily closing data and stage status'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
      - name: Report incomplete update
        if: steps.update.outcome == 'failure'
        run: exit 1
