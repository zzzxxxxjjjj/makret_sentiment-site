name: Probe public exchange gaps
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/gap-source-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - run: python gap_source_probe.py
      - name: Save public source evidence only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- gap-source-probe.json
          for f in data_sources/public-gap-*.json data_sources/public-cffex-*.csv; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save public exchange source evidence for missing indicators'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
