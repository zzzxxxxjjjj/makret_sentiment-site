name: Final public source checks
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/remaining-final-checks.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - run: python remaining_final_checks.py
      - run: |
          python rebuild_saved_page.py
          python build_static_site.py
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in remaining-final-checks.json etf-market.json broad-sentiment-page-cache.json data-freshness.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified ETF quotes and final source audit'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
