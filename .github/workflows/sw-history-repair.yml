name: Repair affected SW history batch only
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
concurrency:
  group: sw-history-backfill
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 42155851491
          github-token: ${{ github.token }}
          pattern: sw-history-*
          path: sw-history-parts
          merge-multiple: true
      - run: python -m pip install akshare
      - run: python sw_history_repair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw-history-repair-cache
          path: |
            sw-repair-cache/*.json
            sw-history-parts/*.json
      - name: Publish validated repaired history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sw-industry-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair SW history using retained successful batches'
          git pull --rebase origin main
          git push origin HEAD:main
