name: Rebuild page and freshness status
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/rebuild-page-status.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-daily.txt
      - name: Rebuild from saved observations and verify dates
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          import importlib.util
          assert importlib.util.find_spec('rqdatac') is None
          allowed={'broad-sentiment-page-cache.json','data-freshness.json'}
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.suffix.lower() in ('.json','.csv','.xlsx','.xlsm') and '.git' not in p.parts and str(p) not in allowed}
          subprocess.run([sys.executable,'rebuild_saved_page.py','--target','2026-11-20'],check=True)
          report=json.loads(pathlib.Path('data-freshness.json').read_text())
          dates={e['id']:e['asOf'] for e in report['entries']}
          for sid in ('hs300-turnover','csi1000-turnover','star50-turnover','margin-guarantee-ratio','margin-investor-participation-ratio'):
              assert dates[sid]>='2026-11-20',(sid,dates[sid])
          assert report['targetDate']=='2026-11-20'
          assert report['allDailyCurrent'] is False
          for name,digest in before.items(): assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          print('Historical source files unchanged; report retains real gaps')
          PY
      - run: python build_static_site.py
      - name: Publish page and status only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- broad-sentiment-page-cache.json data-freshness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild page and current status from verified saved observations'
          git pull --rebase origin main
          git push origin HEAD:main
