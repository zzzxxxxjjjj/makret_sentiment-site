name: Retry remaining cloud datasets
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/retry-remaining-cloud.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: retry-remaining-cloud
  cancel-in-progress: false
jobs:
  markets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
      AIDO_API_KEY: ${{ secrets.AIDO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - run: python retry_remaining_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-market-data
          retention-days: 3
          path: |
            remaining-retry-status.json
            public-index-inputs.json
            index-recovery-status.json
            financing-detail-cache.json
            flows-recovery-status.json
            lhb-daily-cache.json
            cloud-market-inputs.json
            medium-input-audit.json
            medium-recovery-status.json
            public-recovery-status.json
            ifind-stock-snapshot.json
            etf-market.json
            sw-industry-flow.json
            sw-flow-members.json
            rqdata-fund-exposure.json
            style-crowding.json
            akshare-public-inputs.json
            ifind-index-turnover.json
            ifind-medium-bond.json
            akshare-margin-risk.json
  breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DAILY_TARGET_DATE: '2026-11-24'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45539001129
          pattern: breadth-bao-*
          path: breadth-parts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45556885881
          pattern: breadth-bj-*
          path: breadth-parts
          merge-multiple: true
      - run: python breadth_tail_repair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-breadth-data
          retention-days: 3
          path: |
            breadth-tail-repair-status.json
            breadth-public-status.json
            rqdata-breadth-sentiment.json
  option-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - run: python sse_option_gap_recovery.py plan
      - uses: actions/upload-artifact@v4
        with:
          name: retry-option-plan
          path: sse-option-plan.json
          retention-days: 3
  option-bars:
    needs: option-plan
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: {shard: [0,1,2,3,4,5]}
    env:
      PYTHONUNBUFFERED: '1'
      SSE_BAR_BUDGET_SECONDS: '180'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - uses: actions/download-artifact@v4
        with:
          name: retry-option-plan
      - run: python sse_option_gap_recovery.py ${{ matrix.shard }} 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retry-option-bars-${{ matrix.shard }}
          path: option-bar-parts
          retention-days: 3
  publish:
    needs: [markets, breadth, option-plan, option-bars]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: remaining-*-data
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: retry-option-plan
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: retry-option-bars-*
          path: option-bar-parts
          merge-multiple: true
      - run: |
          if [ -f sse-option-plan.json ]; then python sse_option_gap_recovery.py combine; fi
          python rebuild_saved_page.py
          python build_static_site.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.json'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish successful remaining-source retries and precise unresolved gaps'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
