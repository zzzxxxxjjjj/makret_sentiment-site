name: Recover ETF units with AkShare
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/etf-akshare-recovery.yml']
permissions:
  contents: write
concurrency:
  group: etf-units-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - run: python szse_etf_units_refresh.py
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in szse-etf-dated-units.json szse-etf-units-status.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save verified AkShare Shenzhen ETF units and collection status'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
