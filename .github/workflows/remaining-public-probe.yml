name: Validate remaining public fields
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/remaining-public-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - run: python remaining_public_probe.py
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in remaining-public-probe.json data_sources/public-option-kline-sample.json data_sources/public-cffex-*-all.csv; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record validated public option and ETF field availability'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
