name: Backfill 20 daily SW industry flow sessions
on:
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: sw-history-backfill
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install akshare
      - run: python sw_history.py --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: sw-history-${{ matrix.shard }}
          path: sw-history-parts/*.json
  publish:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: sw-history-*
          path: sw-history-parts
          merge-multiple: true
      - run: python sw_history.py --merge
      - name: Publish validated daily industry history only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sw-industry-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Backfill 20 daily SW industry flow sessions'
          git pull --rebase origin main
          git push origin HEAD:main
