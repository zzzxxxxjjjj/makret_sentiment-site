name: Resume missing breadth history
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/breadth-resume.yml']
permissions:
  contents: write
  actions: read
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: {shard: [0,1,2,3]}
    env:
      DAILY_TARGET_DATE: '2026-11-24'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - uses: actions/cache@v4
        with:
          path: .breadth-public-cache
          key: breadth-resume-bj-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: breadth-resume-bj-${{ matrix.shard }}-
      - run: python breadth_public_refresh.py bj ${{ matrix.shard }} 4
      - uses: actions/upload-artifact@v4
        with:
          name: breadth-bj-${{ matrix.shard }}
          path: breadth-parts/*.json.gz
          retention-days: 3
  combine:
    needs: prices
    runs-on: ubuntu-latest
    env:
      DAILY_TARGET_DATE: '2026-11-24'
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45539001129
          pattern: breadth-bao-*
          path: breadth-parts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: breadth-bj-*
          path: breadth-parts
          merge-multiple: true
      - run: python breadth_public_refresh.py combine
      - run: |
          python rebuild_saved_page.py
          python build_static_site.py
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in breadth-public-status.json rqdata-breadth-sentiment.json broad-sentiment-page-cache.json data-freshness.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish resumed public breadth observations and actual gaps'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
