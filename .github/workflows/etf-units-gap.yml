name: Recover dated ETF units
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/etf-units-gap.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Shanghai
      IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - run: python etf_units_gap_recovery.py
      - name: Save only normalized market numbers and status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- etf-units-gap-status.json
          if [ -f data_sources/verified-ifind-etf-units.json ]; then git add -- data_sources/verified-ifind-etf-units.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save verified ETF unit observations or source status without raw authenticated data'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
