name: Validate AkShare replacements
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/akshare-replacements.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - run: python akshare_replacement_probe.py
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- akshare-replacement-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record public AkShare replacement availability'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
