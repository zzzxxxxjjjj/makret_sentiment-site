name: Verify Baostock ETF fallback
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/baostock-etf-check.yml'
permissions:
  contents: read
concurrency:
  group: baostock-etf-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'baostock==0.9.4' 'pandas>=2.2,<3'
      - name: Probe ETF batch coverage and listing status
        run: |
          python - <<'PY'
          import subprocess,sys
          subprocess.run([sys.executable,'baostock_etf_probe.py'],check=True,timeout=180)
          PY
