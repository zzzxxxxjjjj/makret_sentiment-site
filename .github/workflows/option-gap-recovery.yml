name: Recover dated option PCR
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/option-gap-recovery.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {TZ: Asia/Shanghai, PYTHONUNBUFFERED: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - run: python -m py_compile option_gap_recovery.py
      - run: python option_gap_recovery.py
      - run: |
          python rebuild_saved_page.py
          python build_static_site.py
      - name: Publish recovered PCR and actual errors
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in akshare-options-pcr.json option-gap-recovery-status.json broad-sentiment-page-cache.json data-freshness.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish validated dated option PCR observations'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
