name: Recover supported public indicators
# Recovery pass 2: validated single-session LHB and recent valuation overlap.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/public-recovery.yml'
permissions:
  contents: write
concurrency:
  group: public-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-daily.txt
      - run: python -m py_compile public_recovery.py
      - name: Recover supported data and audit remaining schemas
        run: python public_recovery.py
      - name: Rebuild saved page and freshness
        run: |
          python rebuild_saved_page.py
          python build_static_site.py
      - name: Publish verified changes
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- akshare-public-inputs.json cloud-market-inputs.json broad-sentiment-page-cache.json data-freshness.json
          for f in public-recovery-status.json medium-input-audit.json recovery-*.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover verified public indicators and publish remaining input audit'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
