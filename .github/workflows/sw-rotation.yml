name: Refresh AKShare SW industry rotation
on:
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: sw-rotation
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install akshare
      - run: python sw_rotation_refresh.py
      - name: Publish SW rotation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- akshare-sw-industry-rotation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh AKShare SW2021 industry rotation'
          git pull --rebase origin main
          git push origin HEAD:main
