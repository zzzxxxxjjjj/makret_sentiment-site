name: Verify no RQData dependency
on:
  workflow_dispatch:
  push:
    branches: [remove-rqdata-runtime]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cloud.txt pyyaml
      - name: Prove SDK-free imports and blocked legacy access
        run: |
          python - <<'PY'
          import ast, hashlib, importlib.util, os, pathlib, socket, yaml
          from unittest.mock import patch
          for sdk in ('rqdatac','rqdatac_fund'):
              assert importlib.util.find_spec(sdk) is None,sdk
          for p in pathlib.Path('.').rglob('*.py'):
              if '.git' in p.parts: continue
              tree=ast.parse(p.read_text(encoding='utf-8-sig'))
              for node in ast.walk(tree):
                  modules=[a.name for a in node.names] if isinstance(node,ast.Import) else [node.module or ''] if isinstance(node,ast.ImportFrom) else []
                  assert not any(m.split('.')[0] in ('rqdatac','rqdatac_fund') for m in modules),str(p)
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              text=p.read_text();yaml.safe_load(text)
              assert ('secrets.' + 'RQDATAC_CONF') not in text,str(p)
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('.').rglob('*') if p.suffix.lower() in ('.json','.csv','.xlsx','.xlsm') and '.git' not in p.parts}
          with patch.object(socket,'create_connection',side_effect=AssertionError('Network attempted')):
              from retired_provider import RetiredProviderError,client
              import rqdata_connection
              for call in (rqdata_connection.initialize_rqdata,client.init,client.get_price):
                  try: call()
                  except RetiredProviderError: pass
                  else: raise AssertionError('Legacy access was allowed')
              import broad_sentiment as b
              assert b.ENABLE_RQDATA_REFRESH is False
              model=b.broad_market_medium_term_sentiment_snapshot()
              assert model.get('series')
              import aido_style_crowding_refresh, fund_exposure_cloud_sync
              import rqdata_options_refresh, rqdata_late_market_refresh
          for name,digest in before.items(): assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          print('No SDK imports, no legacy network access, historical files unchanged')
          PY
      - name: Block live requests in retained calculation tests
        run: |
          mkdir -p /tmp/offline-check
          printf '%s\n' 'import socket' 'def blocked(*args, **kwargs): raise RuntimeError("Offline test: network disabled")' 'socket.socket.connect = blocked' > /tmp/offline-check/sitecustomize.py
      - name: Independent collectors and retained calculation tests
        env:
          PYTHONPATH: /tmp/offline-check:.
        run: |
          for pattern in test_akshare_*.py test_cloud_market.py test_market_data_sync.py test_rqdata_late_etf.py test_rqdata_trading_day.py test_fund_exposure_refresh.py test_style_crowding.py test_position_refresh.py; do
            python -m unittest discover -s tests -p "$pattern"
          done
      - run: python build_static_site.py
