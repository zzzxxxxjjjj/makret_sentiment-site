name: Recover SSE amount PCR
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sse-option-gap.yml']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - run: python sse_option_gap_recovery.py plan
      - id: target
        run: |
          python - <<'PY'
          import json,os
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('target='+json.load(open('sse-option-plan.json'))['targetDate']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sse-option-plan
          path: sse-option-plan.json
          retention-days: 3
  bars:
    env:
      SSE_BAR_BUDGET_SECONDS: '600'
      PYTHONUNBUFFERED: '1'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - uses: actions/download-artifact@v4
        with: {name: sse-option-plan}
      - uses: actions/cache@v4
        with:
          path: .option-bar-cache
          key: option-bars-${{ matrix.shard }}-${{ needs.plan.outputs.target }}-${{ github.run_id }}
          restore-keys: option-bars-${{ matrix.shard }}-
      - run: python sse_option_gap_recovery.py ${{ matrix.shard }} 6
      - uses: actions/upload-artifact@v4
        with:
          name: option-bars-${{ matrix.shard }}
          path: option-bar-parts/*.json
          retention-days: 3
  publish:
    needs: [plan,bars]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use current saved observations
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-daily.txt
      - uses: actions/download-artifact@v4
        with: {name: sse-option-plan}
      - uses: actions/download-artifact@v4
        with:
          pattern: option-bars-*
          path: option-bar-parts
          merge-multiple: true
      - run: |
          python sse_option_gap_recovery.py combine
          python rebuild_saved_page.py
          python build_static_site.py
      - name: Publish verified daily PCR
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in akshare-options-pcr.json sse-option-gap-status.json broad-sentiment-page-cache.json data-freshness.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish dated SSE amount PCR and recomputed transforms'
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
